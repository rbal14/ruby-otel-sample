# Sandbox credentials. These are intentionally in plain sight because this is a
# throwaway POC namespace -- rotate or replace with a real secret store before
# reusing any of this anywhere that matters.
apiVersion: v1
kind: Secret
metadata:
  name: phr-mysql-secrets
  namespace: power-poc
  labels:
    app.kubernetes.io/part-of: power-poc
type: Opaque
stringData:
  # Consumed by the mysql:8.0 entrypoint.
  MYSQL_ROOT_PASSWORD: "poc-root-pw-change-me"
  MYSQL_DATABASE: "phr_web"
  MYSQL_USER: "phr_app"
  MYSQL_PASSWORD: "poc-app-pw-change-me"

  # Consumed by k8s/mysql-init/01-init-schemas.sh.
  WEB_DB_NAME: "phr_web"
  API_DB_NAME: "phr_api"
  DT_MONITOR_USER: "dtmonitor"
  DT_MONITOR_PASSWORD: "poc-monitor-pw-change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: phr-app-secrets
  namespace: power-poc
  labels:
    app.kubernetes.io/part-of: power-poc
type: Opaque
stringData:
  # Rails refuses to boot in production without this. Regenerate with:
  #   ruby -rsecurerandom -e 'puts SecureRandom.hex(64)'
  SECRET_KEY_BASE: "1a1cbf1e2d1c4b0f8e7a6d5c4b3a29180f7e6d5c4b3a29180f7e6d5c4b3a2918ff0e1d2c3b4a59687766554433221100ffeeddccbbaa99887766554433221100"
